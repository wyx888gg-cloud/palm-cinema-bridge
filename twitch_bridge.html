<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Palm City Twitch Bridge</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{position:fixed;inset:0}
    #player{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
    #status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:#000;font:18px Arial,sans-serif;z-index:0;padding:20px}
  </style>
</head>
<body>
  <div id="status">Palm City Twitch Bridge<br>等待直播來源…</div>
  <iframe id="player" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <script>
  (() => {
    const qs = new URLSearchParams(location.search);
    const source = (qs.get('source') || '').trim();
    let channel = (qs.get('channel') || '').trim();
    let video = (qs.get('video') || '').trim();
    let clip = (qs.get('clip') || '').trim();
    const autoplay = qs.get('autoplay') !== '0';
    const muted = qs.get('muted') !== '0';
    const parent = location.hostname;

    function parseSource(raw) {
      if (!raw) return;
      try {
        const u = new URL(raw);
        const host = u.hostname.replace(/^www\./i,'').toLowerCase();
        const parts = u.pathname.split('/').filter(Boolean);

        if (host === 'clips.twitch.tv' && parts[0]) {
          clip = clip || parts[0];
          return;
        }

        if (host === 'twitch.tv' || host.endsWith('.twitch.tv')) {
          if (parts[0] === 'videos' && parts[1]) {
            video = video || ('v' + parts[1].replace(/^v/i,''));
            return;
          }

          if (parts[0] && !['directory','downloads','jobs','p','settings','subscriptions','wallet'].includes(parts[0].toLowerCase())) {
            channel = channel || parts[0];
          }
        }
      } catch (_) {}
    }

    parseSource(source);

    channel = channel.replace(/^https?:\/\/(www\.)?twitch\.tv\//i,'').split(/[/?#]/)[0];
    video = video ? ('v' + String(video).replace(/^v/i,'').replace(/\D/g,'')) : '';

    let src = '';
    if (clip) {
      src = 'https://clips.twitch.tv/embed?clip=' + encodeURIComponent(clip)
          + '&parent=' + encodeURIComponent(parent)
          + '&autoplay=' + (autoplay ? 'true' : 'false')
          + '&muted=' + (muted ? 'true' : 'false');
    } else if (video) {
      src = 'https://player.twitch.tv/?video=' + encodeURIComponent(video)
          + '&parent=' + encodeURIComponent(parent)
          + '&autoplay=' + (autoplay ? 'true' : 'false')
          + '&muted=' + (muted ? 'true' : 'false');
    } else if (channel) {
      src = 'https://player.twitch.tv/?channel=' + encodeURIComponent(channel)
          + '&parent=' + encodeURIComponent(parent)
          + '&autoplay=' + (autoplay ? 'true' : 'false')
          + '&muted=' + (muted ? 'true' : 'false');
    }

    if (!src) {
      document.getElementById('status').textContent = '缺少有效 Twitch channel / video / source';
      return;
    }

    document.getElementById('player').src = src;
  })();
  </script>
</body>
</html>
